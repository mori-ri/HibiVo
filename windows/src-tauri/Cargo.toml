[package]
name = "hibivo"
version = "0.1.0"
description = "Japanese-first voice input for Windows"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["core"]

[lib]
name = "hibivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
hibivo-core = { path = "core" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
# Schannel instead of rustls: Windows' own TLS and certificate store (corporate proxies work), and no C build.
# unsafe-headers lets cleanup requests drop the Origin header, so APIs treat them as server-side calls.
tauri-plugin-http = { version = "2.8.3", default-features = false, features = [
  "native-tls",
  "http2",
  "charset",
  "system-proxy",
  "unsafe-headers",
] }
tauri-plugin-store = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
