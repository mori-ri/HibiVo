name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "Resources/AppIconSource.png", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Resources/AppIconSource.png", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The TypeScript core and the platform-independent Rust crate, which don't need Windows.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test -p hibivo-core
        working-directory: windows/src-tauri
      - run: cargo fmt --all --check
        working-directory: windows/src-tauri

  # Builds the installer so it can be downloaded from the run and tried on a Windows machine.
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - run: npm ci
      - run: npm run icons
      # generate_context! needs the built pages, even for clippy.
      - run: npm run build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: windows/src-tauri

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: HibiVo-windows-installer
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
