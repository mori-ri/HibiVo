name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "Resources/AppIconSource.png", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "Resources/AppIconSource.png", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # No secrets needed: the tests talk to local fake servers only.
      - name: Test, lint and build
        run: ./gradlew :core:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HibiVo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
