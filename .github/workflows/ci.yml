name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      # Integration tests stay off (HIBIVO_INTEGRATION unset), so no secrets are needed.
      - name: Test
        run: scripts/test.sh

      # Assembles and ad-hoc signs build/HibiVo.app to catch bundling/signing breakage.
      - name: Build app
        run: CONFIG=release scripts/build-app.sh
