name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Lint
        run: scripts/lint.sh

      # Integration tests stay off (HIBIVO_INTEGRATION unset), so no secrets are needed.
      - name: Test
        run: scripts/test.sh

      # Assembles and ad-hoc signs build/HibiVo.app to catch bundling/signing breakage.
      - name: Build app
        run: CONFIG=release scripts/build-app.sh

  # The iOS app and its keyboard extension. Nothing is signed or run: this only checks that they compile.
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          scripts/ios-project.sh

      - name: Build
        run: |
          xcodebuild -project iOS/HibiVo.xcodeproj -scheme HibiVo -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
